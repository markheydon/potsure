name: Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Add Aspire to PATH
        run: echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Playwright E2E (Aspire AppHost)
        run: bash scripts/run-e2e-playwright.sh

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: TestResults/E2E/*.trx
          if-no-files-found: ignore
